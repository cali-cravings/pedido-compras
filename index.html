<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F0E8;--surf:#FDFAF5;--surf2:#EDE8DC;
  --bdr:rgba(0,0,0,.10);--bdr2:rgba(0,0,0,.18);
  --tx:#1a1a1a;--tx2:#666660;--tx3:#999993;
  --or:#8B7355;--or-l:#f5f0e8;
  --gr:#1d9e75;--gr-l:#e1f5ee;
  --hd:#2C3E35;--r:14px;--rs:9px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111112;--surf:#1e1e20;--surf2:#2a2a2d;
  --bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.15);
  --tx:#f0efe8;--tx2:#aaa9a0;--tx3:#666660;
}}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1}
.screen.active{display:flex}

/* HEADER */
.hdr{background:var(--hd);color:#fff;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.hico{width:38px;height:38px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.htxt h1{font-size:16px;font-weight:600}
.htxt p{font-size:12px;opacity:.55;margin-top:1px}
.back{margin-left:auto;background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.back:active{background:rgba(255,255,255,.25)}

/* BODY */
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--surf);border:.5px solid var(--bdr);border-radius:var(--r);padding:14px 16px}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surf);border:.5px solid var(--bdr);border-radius:var(--r);padding:16px}
.stat-l{font-size:12px;color:var(--tx2);margin-bottom:6px}
.stat-n{font-size:28px;font-weight:700}
.stat-n.o{color:var(--or)}
.stat-n.g{color:var(--gr)}

/* BUTTONS */
.btn-or{background:var(--or);color:#fff;border:none;border-radius:var(--r);padding:15px;font-size:15px;font-weight:600;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
.btn-or:active{opacity:.85}
.btn-wa{background:#25d366;color:#fff;border:none;border-radius:var(--r);padding:15px;font-size:15px;font-weight:600;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;-webkit-tap-highlight-color:transparent}
.btn-wa:active{opacity:.85}
.btn-sec{background:none;border:.5px solid var(--bdr2);border-radius:var(--r);padding:13px;font-size:14px;color:var(--tx2);cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent}
.btn-sec:active{background:var(--surf2)}
.btn-edit{background:none;border:.5px solid var(--or);border-radius:var(--r);padding:13px;font-size:14px;color:var(--or);cursor:pointer;width:100%;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
.btn-edit:active{background:var(--or-l)}
.btn-delivered{background:none;border:.5px solid var(--gr);border-radius:var(--r);padding:13px;font-size:14px;color:var(--gr);cursor:pointer;width:100%;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
.btn-delivered:active{background:var(--gr-l)}
.btn-delivered.done{opacity:.4;pointer-events:none}
.btn-excel-home{background:none;border:.5px solid #2C3E35;border-radius:var(--r);padding:13px;font-size:14px;color:#2C3E35;cursor:pointer;width:100%;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
.btn-excel-home:active{background:#EDE8DC}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-falta-main{background:none;border:.5px solid #e8560a;border-radius:var(--r);padding:13px;font-size:14px;color:#e8560a;cursor:pointer;width:100%;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
.btn-falta-main:active{background:#fdf0ea}
.btn-falta-main.ativo{background:#fdf0ea}
.btn-excel{background:none;border:.5px solid #185fa5;border-radius:var(--r);padding:13px;font-size:14px;color:#185fa5;cursor:pointer;width:100%;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
.btn-excel:active{background:#e6f1fb}
.badge-d{background:#e6f1fb;color:#0c447c}
.bd{background:#e6f1fb;color:#0c447c}

/* LIST */
.sec-l{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.ri{background:var(--surf);border:.5px solid var(--bdr);border-radius:var(--r);padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ri:active{background:var(--surf2)}
.rico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.rico.p{background:#faeeda}
.rico.s{background:var(--gr-l)}
.rm{flex:1;min-width:0}
.rt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--tx2);margin-top:2px}
.badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;flex-shrink:0}
.bp{background:#faeeda;color:#854f0b}
.bs{background:var(--gr-l);color:#0f6e56}
.ba{background:#fcebeb;color:#a32d2d}
.empty{text-align:center;padding:32px 20px;color:var(--tx3);font-size:14px}
.empty i{font-size:36px;display:block;margin-bottom:10px;opacity:.4}

/* FORM FIELDS */
.fl{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:block}
input,select,textarea{width:100%;background:var(--surf2);border:.5px solid var(--bdr);border-radius:var(--rs);padding:12px 13px;font-size:15px;font-family:inherit;color:var(--tx);outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(232,86,10,.12);background:var(--surf)}
textarea{resize:none;line-height:1.5}

/* ITEM ROWS */
.items-list{display:flex;flex-direction:column;gap:12px}

/* Each item is a mini-card */
.item-card{background:var(--surf2);border:.5px solid var(--bdr);border-radius:var(--rs);overflow:visible;position:relative;z-index:1}
.item-name-row{display:flex;align-items:center;border-bottom:.5px solid var(--bdr);position:relative}
.item-name-inp{flex:1;background:transparent;border:none;border-radius:0;padding:12px 13px;font-size:15px;box-shadow:none !important}
.item-name-inp:focus{border:none;box-shadow:none !important;background:transparent}
.item-del{width:42px;height:42px;background:none;border:none;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.item-del:active{color:#e24b4a}
.item-qty-row{display:flex;align-items:center;gap:8px;padding:8px 12px}
.item-qty-inp{width:90px;flex:none;text-align:center;padding:8px;font-size:14px;border-radius:var(--rs)}
.item-unit-sel{flex:1;padding:8px 10px;font-size:14px;border-radius:var(--rs)}

/* SUGGESTIONS */
.sug-box{position:absolute;top:100%;left:0;right:0;background:var(--surf);border:.5px solid var(--bdr2);border-radius:var(--rs);z-index:9999;max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 8px 32px rgba(0,0,0,.22);display:none}
.sug-item{padding:11px 14px;font-size:14px;cursor:pointer;border-top:.5px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent}
.sug-item:active,.sug-item.hi{background:var(--or-l)}
.sug-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug-tag{font-size:10px;padding:2px 7px;border-radius:10px;flex-shrink:0;white-space:nowrap;font-weight:600}
.tag-seco{background:#e6f1fb;color:#0c447c}
.tag-frios{background:#e1f5ee;color:#0f6e56}
.tag-carnes{background:#fcebeb;color:#a32d2d}
.tag-peixes{background:#e6f1fb;color:#185fa5}
.tag-horti{background:#eaf3de;color:#3b6d11}
.tag-bebidas{background:#faeeda;color:#854f0b}
.tag-outros{background:var(--surf2);color:var(--tx2)}
.tag-coz{background:#e1f5ee;color:#0f6e56}
.tag-bar{background:#faeeda;color:#854f0b}

/* ADD ITEM */
.btn-add{background:none;border:1.5px dashed var(--bdr2);border-radius:var(--rs);padding:11px;font-size:14px;color:var(--or);cursor:pointer;width:100%;font-family:inherit;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;-webkit-tap-highlight-color:transparent}
.btn-add:active{background:var(--or-l)}

/* URGENCY */
.urg-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.urg{border:.5px solid var(--bdr2);border-radius:var(--rs);padding:10px 4px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;color:var(--tx2);-webkit-tap-highlight-color:transparent}
.urg.sb{border-color:var(--gr);background:var(--gr-l);color:#0f6e56}
.urg.sm{border-color:#ba7517;background:#faeeda;color:#854f0b}
.urg.sa{border-color:#a32d2d;background:#fcebeb;color:#a32d2d}

/* DETAIL */
.dr{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:.5px solid var(--bdr)}
.dr:last-child{border-bottom:none}
.dk{font-size:13px;color:var(--tx2)}
.dv{font-size:14px;font-weight:600;text-align:right;max-width:200px}

/* TOAST */
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;z-index:999;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.wa-ico{width:22px;height:22px;fill:currentColor;flex-shrink:0}
#loading-bar{display:none;position:fixed;top:0;left:0;right:0;height:3px;background:var(--or);z-index:999;animation:loadpulse 1s infinite}
@keyframes loadpulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}

/* MODAL SENHA */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--surf);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
.modal-box h2{font-size:20px;font-weight:700;color:var(--tx);margin-bottom:8px}
.modal-box p{font-size:14px;color:var(--tx2);margin-bottom:20px;line-height:1.5}
.modal-field-label{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.modal-input{width:100%;border:1.5px solid var(--bdr2);border-radius:8px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--tx);background:var(--surf);outline:none;margin-bottom:20px}
.modal-input:focus{border-color:#2C3E35;box-shadow:0 0 0 3px rgba(44,62,53,.12)}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-cancel{background:none;border:1.5px solid var(--bdr2);border-radius:10px;padding:13px;font-size:15px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit}
.modal-cancel:active{background:var(--surf2)}
.modal-confirm{background:#e24b4a;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit}
.modal-confirm:active{opacity:.85}

/* ITENS EM FALTA */
.item-falta{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:.5px solid var(--bdr)}
.item-falta:last-child{border-bottom:none}
.item-falta-key{font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.item-falta-key.sem{color:#e8560a;font-weight:500}
.item-falta-val{display:flex;align-items:center;gap:8px}
.item-falta-qty{font-size:14px;font-weight:600}
.item-falta-qty.zero{color:#e8560a;text-decoration:line-through}
.btn-falta{background:none;border:.5px solid var(--bdr2);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--tx2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-falta:active{background:#faeeda}
.btn-falta.marcado{border-color:#e8560a;color:#e8560a;background:#fdf0ea}
.alerta-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#faeeda;color:#854f0b;flex-shrink:0}

/* MODAL MES */
.modal-mes-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mes-overlay.show{display:flex}
.modal-mes-box{background:var(--surf);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
.modal-mes-box h2{font-size:18px;font-weight:700;color:var(--tx);margin-bottom:6px}
.modal-mes-box p{font-size:13px;color:var(--tx2);margin-bottom:18px}
.modal-mes-selects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
</style>
</head>

function norm(s){return s.toUpperCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();}
function pad(n){return String(n).padStart(2,'0');}
function fmtTs(ts){
  const d=new Date(ts),t=new Date();
  return d.toDateString()===t.toDateString()
    ?'Hoje, '+pad(d.getHours())+':'+pad(d.getMinutes())
    :pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function searchDB(q){
  if(!q||q.length<2) return [];
  const t=norm(q);
  return DB.filter(i=>norm(i.n).includes(t)).slice(0,8);
}

let itemCount=0, currentDetail=null, editingId=null, filter='all', aprovAction=null;
let allPeds=[];

// ---- FIREBASE LISTENER ----
function initFirebase(){
  showLoading(true);
  PED_REF.orderByChild('ts').on('value', snap=>{
    allPeds=[];
    snap.forEach(child=>{ allPeds.unshift({fbKey:child.key,...child.val()}); });
    showLoading(false);
    renderHome();
  }, err=>{ showLoading(false); toast('Erro de conexão ⚠️'); });
}
function showLoading(show){
  const el=document.getElementById('loading-bar');
  if(el) el.style.display=show?'block':'none';
}

// ---- NAV ----
function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if(id==='s-home') renderHome();
  if(id==='s-form' && !editingId) initForm();
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function setFilter(f){ filter=f; renderHome(); }

// ---- HOME ----
function renderHome(){
  const today=new Date().toDateString();
  document.getElementById('cnt-p').textContent=allPeds.filter(r=>r.status==='pending').length;
  document.getElementById('cnt-s').textContent=allPeds.filter(r=>r.status==='aprovado'&&new Date(r.tsAprovacao||r.ts).toDateString()===today).length;
  const list=document.getElementById('req-list');
  document.getElementById('list-title').textContent = filter==='pending' ? 'Pedidos pendentes' : 'Todos os pedidos';
  const shown = filter==='pending' ? allPeds.filter(r=>r.status==='pending') : allPeds;
  if(!shown.length){
    list.innerHTML='<div class="empty"><i class="ti ti-shopping-cart"></i>Nenhum pedido ainda.<br>Crie o primeiro!</div>';
    return;
  }
  const stMap={pending:{cls:'bp',lb:'⏳ Pendente'},aprovado:{cls:'bs',lb:'✅ Aprovado'},recusado:{cls:'ba',lb:'❌ Recusado'}};
  list.innerHTML=shown.map(r=>{
    const st=stMap[r.status]||stMap.pending;
    const ico=r.status==='pending'?'⏳':r.status==='aprovado'?'🛒':'🚫';
    const cls=r.status==='pending'?'p':'s';
    const truck=r.emCaminho?' <span title="A caminho do fornecedor">🚚</span>':'';
    return '<div class="ri" data-key="'+r.fbKey+'"><div class="rico '+cls+'">'+ico+'</div><div class="rm"><div class="rt">'+r.unidade+' · '+r.setor+'</div><div class="rs">'+r.nome+' · '+fmtTs(r.ts)+' · '+r.items.length+' item'+(r.items.length>1?'s':'')+'</div></div><span class="badge '+st.cls+'">'+st.lb+truck+'</span></div>';
  }).join('');
  list.querySelectorAll('.ri').forEach(el=>{
    el.addEventListener('click',()=>openDetail(el.dataset.key));
  });
}

// ---- DETAIL ----
function row(k,v){return '<div class="dr"><span class="dk">'+k+'</span><span class="dv">'+v+'</span></div>';}
function openDetail(fbKey){
  currentDetail=allPeds.find(r=>r.fbKey===fbKey);
  if(!currentDetail) return;
  renderDetailView();
  goTo('s-detail');
}
function renderDetailView(){
  document.getElementById('d-setor').textContent=currentDetail.unidade+' · '+currentDetail.setor;
  document.getElementById('d-date').textContent=fmtTs(currentDetail.ts);
  const stLb={pending:'⏳ Pendente',aprovado:'✅ Aprovado',recusado:'❌ Recusado'};
  document.getElementById('d-info').innerHTML=
    row('Solicitante',currentDetail.nome)+
    row('Status',stLb[currentDetail.status]||'—')+
    (currentDetail.obs?'<div class="dr"><span class="dk">Obs</span><span class="dv" style="font-weight:400;color:var(--tx2)">'+currentDetail.obs+'</span></div>':'');
  document.getElementById('d-items').innerHTML=currentDetail.items.map(it=>{
    return '<div class="item-falta"><span class="item-falta-key">'+it.n+(it.obs?' <span style="color:var(--tx3)">('+it.obs+')</span>':'')+'</span><span class="item-falta-val"><span class="item-falta-qty">'+it.q+' '+it.u+'</span></span></div>';
  }).join('');
  const obsBox=document.getElementById('d-obs-aprov');
  if(currentDetail.status!=='pending' && (currentDetail.aprovadoPor||currentDetail.obsAprovacao)){
    obsBox.innerHTML='<div class="card">'+
      row(currentDetail.status==='aprovado'?'Aprovado por':'Recusado por',currentDetail.aprovadoPor||'—')+
      (currentDetail.tsAprovacao?row('Em',fmtTs(currentDetail.tsAprovacao)):'')+
      (currentDetail.obsAprovacao?row('Observação',currentDetail.obsAprovacao):'')+
    '</div>';
  } else { obsBox.innerHTML=''; }
  const act=document.getElementById('d-actions');
  if(currentDetail.status==='pending'){
    act.innerHTML='<div class="btn-row">'+
      '<button class="modal-confirm" style="border-radius:14px" onclick="openAprovModal(\'aprovado\')"><i class="ti ti-check"></i> Aprovar</button>'+
      '<button class="modal-cancel" style="border-radius:14px;color:#a32d2d;border-color:#f0c9c8" onclick="openAprovModal(\'recusado\')"><i class="ti ti-x"></i> Recusar</button>'+
    '</div>';
  } else if(currentDetail.status==='aprovado' && !currentDetail.emCaminho){
    act.innerHTML='<button class="btn-wa" style="background:#2C3E35" onclick="marcarACaminho()">🚚 Marcar como enviado ao fornecedor</button>';
  } else if(currentDetail.status==='aprovado' && currentDetail.emCaminho){
    act.innerHTML='<div class="card">'+
      row('Status entrega','🚚 A caminho do fornecedor')+
      (currentDetail.tsEnvio?row('Marcado em',fmtTs(currentDetail.tsEnvio)):'')+
    '</div><button class="btn-sec" onclick="desmarcarACaminho()" style="color:var(--tx3)">Desmarcar</button>';
  } else { act.innerHTML=''; }
  const be=document.getElementById('btn-edit');
  if(be) be.style.display=currentDetail.status==='pending'?'flex':'none';
}

// ---- APROVACAO ----
function openAprovModal(action){
  aprovAction=action;
  document.getElementById('modal-aprov-title').textContent = action==='aprovado' ? 'Aprovar pedido' : 'Recusar pedido';
  const btn=document.getElementById('modal-aprov-confirm');
  btn.textContent = action==='aprovado' ? 'Confirmar aprovação' : 'Confirmar recusa';
  btn.style.background = action==='aprovado' ? '#1d9e75' : '#e24b4a';
  document.getElementById('modal-aprov-nome').value='';
  document.getElementById('modal-aprov-obs').value='';
  document.getElementById('modal-aprov').classList.add('show');
  setTimeout(()=>document.getElementById('modal-aprov-nome').focus(),100);
}
function closeAprovModal(){ document.getElementById('modal-aprov').classList.remove('show'); }
function confirmAprov(){
  const nome=document.getElementById('modal-aprov-nome').value.trim();
  if(!nome){ toast('Informe seu nome ⚠️'); return; }
  const obs=document.getElementById('modal-aprov-obs').value.trim();
  const upd={status:aprovAction,aprovadoPor:nome,tsAprovacao:Date.now(),obsAprovacao:obs};
  PED_REF.child(currentDetail.fbKey).update(upd);
  closeAprovModal();
  const full={...currentDetail,...upd};
  openWAResultado(full);
  toast(aprovAction==='aprovado'?'Pedido aprovado ✅':'Pedido recusado ❌');
  goTo('s-home');
}

// ---- EM CAMINHO (ENVIADO AO FORNECEDOR) ----
function marcarACaminho(){
  if(!currentDetail) return;
  const upd={emCaminho:true,tsEnvio:Date.now()};
  PED_REF.child(currentDetail.fbKey).update(upd);
  currentDetail={...currentDetail,...upd};
  toast('Pedido marcado como a caminho 🚚');
  renderDetailView();
}
function desmarcarACaminho(){
  if(!currentDetail) return;
  const upd={emCaminho:false,tsEnvio:null};
  PED_REF.child(currentDetail.fbKey).update(upd);
  currentDetail={...currentDetail,...upd};
  toast('Desmarcado');
  renderDetailView();
}

// ---- DELETE ----
function deleteReq(){
  document.getElementById('modal-delete-input').value='';
  document.getElementById('modal-delete').classList.add('show');
  setTimeout(()=>document.getElementById('modal-delete-input').focus(),100);
}
function closeDeleteModal(){ document.getElementById('modal-delete').classList.remove('show'); }
function confirmDelete(){
  const senha=document.getElementById('modal-delete-input').value.trim();
  if(senha!=='000813'){
    document.getElementById('modal-delete-input').value='';
    document.getElementById('modal-delete-input').focus();
    toast('Senha incorreta ❌'); return;
  }
  closeDeleteModal();
  PED_REF.child(currentDetail.fbKey).remove();
  toast('Excluído ✓'); goTo('s-home');
}

// ---- EDIT ----
function editReq(){
  if(!currentDetail) return;
  editingId=currentDetail.fbKey;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-form').classList.add('active');
  window.scrollTo(0,0);
  itemCount=0;
  document.getElementById('items-list').innerHTML='';
  document.querySelector('#s-form .htxt h1').textContent='Editar pedido';
  document.getElementById('f-unidade').value=currentDetail.unidade||'Cali Cravings';
  document.getElementById('f-setor').value=currentDetail.setor||'Cozinha';
  document.getElementById('f-nome').value=currentDetail.nome||'';
  document.getElementById('f-obs').value=currentDetail.obs||'';
  currentDetail.items.forEach(it=>{
    addItem();
    const cards=document.querySelectorAll('.item-card');
    const last=cards[cards.length-1];
    const ninp=last.querySelector('.item-name-inp');
    ninp.value=it.n; ninp.dataset.cod=it.c||'';
    last.querySelector('.item-qty-inp').value=it.q;
    last.querySelector('.item-obs-inp').value=it.obs||'';
    const us=last.querySelector('.item-unit-sel');
    const fi=[...us.options].findIndex(o=>o.value.toLowerCase()===(it.u||'').toLowerCase());
    if(fi>=0) us.selectedIndex=fi;
  });
}

// ---- FORM ----
function initForm(){
  editingId=null; itemCount=0;
  document.querySelector('#s-form .htxt h1').textContent='Novo pedido';
  ['f-nome','f-obs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('items-list').innerHTML='';
  addItem();
}

function addItem(){
  itemCount++;
  const card=document.createElement('div');
  card.className='item-card'; card.id='ic'+itemCount;
  const nameRow=document.createElement('div'); nameRow.className='item-name-row';
  const inp=document.createElement('input');
  inp.type='text'; inp.className='item-name-inp';
  inp.placeholder='Buscar insumo...';
  inp.autocomplete='off'; inp.autocorrect='off'; inp.spellcheck=false;
  const delBtn=document.createElement('button');
  delBtn.type='button'; delBtn.className='item-del';
  delBtn.innerHTML='<i class="ti ti-trash"></i>';
  delBtn.onclick=()=>card.remove();
  nameRow.appendChild(inp); nameRow.appendChild(delBtn);
  const sugBox=document.createElement('div'); sugBox.className='sug-box';
  const qtyRow=document.createElement('div'); qtyRow.className='item-qty-row';
  const qtyInp=document.createElement('input');
  qtyInp.type='number'; qtyInp.className='item-qty-inp';
  qtyInp.placeholder='Qtd'; qtyInp.min='0'; qtyInp.step='0.5';
  const unitSel=document.createElement('select'); unitSel.className='item-unit-sel';
  ['KG','G','L','ML','UN','CX','FARDO','SACO','LATA','PT','PC','FD','BD','DZ','BR'].forEach(u=>{
    const o=document.createElement('option'); o.value=u; o.textContent=u; unitSel.appendChild(o);
  });
  qtyRow.appendChild(qtyInp); qtyRow.appendChild(unitSel);
  const obsRow=document.createElement('div'); obsRow.style.cssText='padding:0 12px 10px';
  const obsInp=document.createElement('input');
  obsInp.type='text'; obsInp.className='item-obs-inp';
  obsInp.placeholder='Observação (opcional)';
  obsInp.style.cssText='font-size:13px;padding:8px 10px';
  obsRow.appendChild(obsInp);
  card.appendChild(nameRow); card.appendChild(sugBox); card.appendChild(qtyRow); card.appendChild(obsRow);
  document.getElementById('items-list').appendChild(card);
  let results=[];
  function renderSug(items){
    results=items;
    if(!items.length){sugBox.style.display='none';return;}
    sugBox.innerHTML=items.map((item,i)=>{
      const cat=(item.s&&CAT[item.s])||{cls:'tag-outros',lb:'Outros'};
      return '<div class="sug-item" data-i="'+i+'"><span class="sug-nm">'+cap(item.n)+'</span><span class="sug-tag '+cat.cls+'">'+cat.lb+'</span></div>';
    }).join('');
    sugBox.style.display='block';
    sugBox.querySelectorAll('.sug-item').forEach(el=>{
      el.addEventListener('touchstart',e=>{e.preventDefault();pickSug(parseInt(el.dataset.i));},{passive:false});
      el.addEventListener('mousedown',e=>{e.preventDefault();pickSug(parseInt(el.dataset.i));});
    });
  }
  function pickSug(idx){
    const item=results[idx]; if(!item) return;
    inp.value=cap(item.n);
    inp.dataset.cod=item.c||'';
    const fi=[...unitSel.options].findIndex(o=>o.value.toLowerCase()===item.u.toLowerCase());
    if(fi>=0) unitSel.selectedIndex=fi;
    sugBox.style.display='none'; qtyInp.focus();
  }
  inp.addEventListener('input',()=>renderSug(searchDB(inp.value.trim())));
  inp.addEventListener('focus',()=>{if(inp.value.trim().length>=2) renderSug(searchDB(inp.value.trim()));});
  inp.addEventListener('blur',()=>setTimeout(()=>{sugBox.style.display='none';},200));
  inp.focus();
}

function getItems(){
  return [...document.querySelectorAll('.item-card')].map(card=>{
    const inp=card.querySelector('.item-name-inp');
    const nome=inp.value.trim();
    let cod=inp.dataset.cod||'';
    if(!cod && nome){
      const found=DB.find(i=>i.n.toUpperCase()===nome.toUpperCase());
      if(found) cod=String(found.c);
    }
    return {
      c:cod, n:nome,
      q:card.querySelector('.item-qty-inp').value||'—',
      u:card.querySelector('.item-unit-sel').value,
      obs:card.querySelector('.item-obs-inp').value.trim()
    };
  }).filter(it=>it.n);
}

function mkPed(items,status){
  return{
    ts:Date.now(),
    unidade:document.getElementById('f-unidade').value,
    setor:document.getElementById('f-setor').value,
    nome:document.getElementById('f-nome').value.trim()||'Não informado',
    obs:document.getElementById('f-obs').value.trim(),
    items,status
  };
}

function saveDraft(){
  const items=getItems();
  if(!items.length){alert('Adicione pelo menos um item.');return;}
  const ped=mkPed(items,'pending');
  if(editingId){ PED_REF.child(editingId).update(ped); toast('Pedido atualizado ✓'); }
  else { PED_REF.push(ped); toast('Rascunho salvo 📝'); }
  editingId=null; goTo('s-home');
}

function buildMsgPedido(p){
  const d=new Date(p.ts);
  const dt=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  let m='*🛒 NOVO PEDIDO DE COMPRA*\n';
  m+='━━━━━━━━━━━━━━━━━━\n';
  m+='🏪 *Unidade:* '+p.unidade+'\n';
  m+='📍 *Setor:* '+p.setor+'\n';
  m+='👤 *Solicitante:* '+p.nome+'\n';
  m+='📅 '+dt+'\n';
  m+='━━━━━━━━━━━━━━━━━━\n';
  m+='*ITENS SOLICITADOS:*\n\n';
  p.items.forEach((it,i)=>{m+=(i+1)+'. '+it.n+' — *'+it.q+' '+it.u+'*'+(it.obs?' _('+it.obs+')_':'')+'\n';});
  if(p.obs) m+='\n📝 *Obs geral:* '+p.obs;
  m+='\n\n_Aguardando aprovação de compras_';
  return m;
}
function buildMsgResultado(p){
  const ok=p.status==='aprovado';
  let m=(ok?'*✅ PEDIDO APROVADO*\n':'*❌ PEDIDO RECUSADO*\n');
  m+='━━━━━━━━━━━━━━━━━━\n';
  m+='🏪 *Unidade:* '+p.unidade+' · '+p.setor+'\n';
  m+='👤 *Solicitante:* '+p.nome+'\n';
  m+=(ok?'🛍️ *Aprovado por:* ':'🚫 *Recusado por:* ')+p.aprovadoPor+'\n';
  if(p.obsAprovacao) m+='📝 *Obs:* '+p.obsAprovacao+'\n';
  m+='━━━━━━━━━━━━━━━━━━\n*ITENS:*\n\n';
  p.items.forEach((it,i)=>{m+=(i+1)+'. '+it.n+' — '+it.q+' '+it.u+'\n';});
  return m;
}
function openWA(p){window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(buildMsgPedido(p)),'_blank');}
function openWAResultado(p){window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(buildMsgResultado(p)),'_blank');}

function sendPedido(){
  const items=getItems();
  if(!items.length){alert('Adicione pelo menos um item.');return;}
  const ped=mkPed(items,'pending');
  if(editingId){
    PED_REF.child(editingId).update(ped);
    openWA({...ped});
  } else {
    PED_REF.push(ped);
    openWA(ped);
  }
  toast('Pedido enviado pelo WhatsApp ✅'); editingId=null; goTo('s-home');
}
function reenviarWA(){ if(currentDetail) openWA(currentDetail); }

// ---- EXCEL ----
function exportExcel(){
  if(!currentDetail) return;
  const stLb={pending:'Pendente',aprovado:'Aprovado',recusado:'Recusado'};
  const rows=[
    ['PEDIDO DE COMPRA','',''],
    ['','',''],
    ['Data',fmtTs(currentDetail.ts),''],
    ['Unidade',currentDetail.unidade,''],
    ['Setor',currentDetail.setor,''],
    ['Solicitante',currentDetail.nome,''],
    ['Status',stLb[currentDetail.status]||'—',''],
    ['','',''],
    ['ITEM','QUANTIDADE','UNIDADE','OBSERVAÇÃO'],
    ...currentDetail.items.map(it=>[it.n,it.q,it.u,it.obs||''])
  ];
  const csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='pedido_'+pad(new Date(currentDetail.ts).getDate())+pad(new Date(currentDetail.ts).getMonth()+1)+'_'+currentDetail.setor.replace(/ /g,'_')+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Exportado! Abra no Excel 📊');
}

function exportConsolidado(){
  const today=new Date().toDateString();
  const todayPeds=allPeds.filter(r=>new Date(r.ts).toDateString()===today);
  if(!todayPeds.length){toast('Nenhum pedido hoje');return;}
  const stLb={pending:'Pendente',aprovado:'Aprovado',recusado:'Recusado'};
  let rows=[['PEDIDOS DO DIA — '+new Date().toLocaleDateString('pt-BR'),'','','','','']];
  rows.push(['','','','','','']);
  rows.push(['HORA','UNIDADE','SETOR','SOLICITANTE','STATUS','ITENS']);
  todayPeds.forEach(p=>{
    const itemsStr=p.items.map(it=>it.n+' ('+it.q+' '+it.u+')').join(' | ');
    rows.push([fmtTs(p.ts),p.unidade,p.setor,p.nome,stLb[p.status]||'—',itemsStr]);
  });
  const csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='pedidos_consolidado_'+pad(new Date().getDate())+pad(new Date().getMonth()+1)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Consolidado exportado 📊');
}

initFirebase();
